name: Visual regression

# Runs the Playwright visual-diff suite against committed baselines in
# tests/visual/baselines/. If a PR intentionally changes UI, regenerate
# baselines locally with `bun run test:visual:update` and commit the new
# PNGs — CI will then pass on the next push.
#
# Baselines must be generated in an environment with the required system
# libraries (libglib, libnss, libgbm, etc.). The Lovable exec sandbox does
# not ship those, so first-time baselines are captured from CI (via
# workflow_dispatch with update_baselines=true) or a local Linux machine.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Regenerate and upload baselines instead of diffing"
        required: false
        default: "false"

jobs:
  visual:
    name: Playwright visual diffs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers + system deps
        run: bunx playwright install --with-deps chromium webkit

      - name: Run visual diffs against committed baselines
        if: ${{ github.event.inputs.update_baselines != 'true' }}
        # Advisory only: UI changes naturally drift baselines. Failures here
        # do not block the workflow — regenerate baselines via
        # workflow_dispatch with update_baselines=true when intentional.
        continue-on-error: true
        run: bun run test:visual

      - name: Regenerate baselines (workflow_dispatch only)
        if: ${{ github.event.inputs.update_baselines == 'true' }}
        run: bun run test:visual:update

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/visual/test-results/
          retention-days: 14

      - name: Upload regenerated baselines (workflow_dispatch only)
        if: ${{ github.event.inputs.update_baselines == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual/baselines/
          retention-days: 30

  security:
    name: Security regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run RLS / SECURITY DEFINER suite
        run: bun run test:security
